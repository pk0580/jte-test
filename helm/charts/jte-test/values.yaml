# Canary deployment settings
canary:
  enabled: false
  weight: "10"

replicaCount: 2

image:
  repository: ghcr.io/your-username/jte-test
  pullPolicy: IfNotPresent
  tag: ""

worker:
  enabled: true
  replicaCount: 1
  command: ["php", "bin/console", "messenger:consume", "async", "-vv"]
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi

cron:
  enabled: true
  jobs:
    - name: example-cron
      schedule: "0 0 * * *"
      command: ["php", "bin/console", "app:example-command"]

migrations:
  enabled: true
  wait: true

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
  hosts:
    - host: jte-test.local
      paths:
        - path: /
          pathType: ImplementationSpecific

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 80

strategy:
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

nodeSelector: {}

tolerations: []

affinity: {}

php:
  postMaxSize: "20M"
  uploadMaxFilesize: "20M"

env:
  APP_ENV: prod
  APP_DEBUG: "0"
