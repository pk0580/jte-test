{{- if .Values.cron.enabled }}
{{- range .Values.cron.jobs }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "jte-test.fullname" $ }}-{{ .name }}
  labels:
    {{- include "jte-test.labels" $ | nindent 4 }}
spec:
  schedule: {{ .schedule | quote }}
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: {{ .name }}
              image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag | default $.Chart.AppVersion }}"
              command: {{ .command | toJson }}
              env:
                - name: APP_ENV
                  value: {{ $.Values.env.APP_ENV | quote }}
                - name: APP_DEBUG
                  value: {{ $.Values.env.APP_DEBUG | quote }}
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "jte-test.fullname" $ }}-db
                      key: database-url
          restartPolicy: OnFailure
{{- end }}
{{- end }}
