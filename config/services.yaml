# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    App\Infrastructure\Prometheus\MessengerQueueCollector:
        public: true
        tags: ['prometheus_metrics_bundle.metrics_collector']
        arguments:
            $metricsCache: '@app.metrics_cache'
            $namespace: '%prometheus_metrics_bundle.namespace%'

    App\Infrastructure\Prometheus\DoctrineFlushCollector:
        public: true
        tags: ['prometheus_metrics_bundle.metrics_collector']
        arguments:
            $appCache: '@cache.app'
            $namespace: '%prometheus_metrics_bundle.namespace%'


    App\Infrastructure\Prometheus\SystemMetricsCollector:
        public: true
        tags: ['prometheus_metrics_bundle.metrics_collector']
        arguments:
            $namespace: '%prometheus_metrics_bundle.namespace%'

    App\Infrastructure\Prometheus\DomainMetricsCollector:
        public: true
        tags: ['prometheus_metrics_bundle.metrics_collector']
        arguments:
            $appCache: '@cache.app'
            $namespace: '%prometheus_metrics_bundle.namespace%'

    App\Infrastructure\Prometheus\HttpRequestSubscriber:
        arguments:
            $namespace: '%prometheus_metrics_bundle.namespace%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    Prometheus\CollectorRegistry:
        alias: prometheus_metrics_bundle.collector_registry

    App\Infrastructure\Persistence\Doctrine\Listener\DomainEventListener:
        tags:
            - { name: 'doctrine.event_listener', event: 'onFlush' }
            - { name: 'doctrine.event_listener', event: 'postFlush' }

    App\Infrastructure\Persistence\Doctrine\Repository\OrderSearchIndexerRepository:
        arguments: []

    App\Domain\Repository\OrderSearchIndexerRepositoryInterface:
        alias: App\Infrastructure\Persistence\Doctrine\Repository\OrderSearchIndexerRepository

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    # Wrap PriceParser with cache and circuit breaker
    App\Infrastructure\Parser\Decorator\CachedPriceParserDecorator:
        decorates: 'App\Domain\Service\PriceParserInterface'
        arguments:
            $inner: '@App\Infrastructure\Parser\Decorator\CachedPriceParserDecorator.inner'
            $appCache: '@cache.app'
            $logger: '@logger'

    App\Domain\Service\PriceParserInterface:
        alias: App\Infrastructure\Parser\PriceParser

    App\Domain\Repository\OrderRepositoryInterface:
        alias: App\Infrastructure\Persistence\Doctrine\Repository\OrderRepository

    App\Domain\Repository\ArticleRepositoryInterface:
        alias: App\Infrastructure\Persistence\Doctrine\Repository\ArticleRepository

    App\Domain\Repository\PayTypeRepositoryInterface:
        alias: App\Infrastructure\Persistence\Doctrine\Repository\PayTypeRepository

    App\Domain\Repository\OrderSearchInterface:
        alias: App\Infrastructure\Search\FallbackSearchProvider

    App\Infrastructure\Resilience\CircuitBreaker:
        arguments:
            $cache: '@cache.app'
            $name: 'manticore_search'
            $failureThreshold: 3
            $recoveryTime: 60

    App\Infrastructure\Search\CircuitBreakerSearchProvider:
        arguments:
            $inner: '@App\Infrastructure\Search\ManticoreOrderSearch'
            $circuitBreaker: '@App\Infrastructure\Resilience\CircuitBreaker'

    App\Infrastructure\Search\FallbackSearchProvider:
        arguments:
            $primary: '@App\Infrastructure\Search\CircuitBreakerSearchProvider'
            $fallback: '@App\Infrastructure\Search\SqlOrderSearchProvider'

    App\Domain\Repository\OrderStatsProviderInterface:
        alias: App\Infrastructure\Persistence\Doctrine\Repository\OrderStatsProvider

    # Decorators for reference repositories caching
    App\Infrastructure\Persistence\Doctrine\Repository\Decorator\ArticleRepositoryCacheDecorator:
        decorates: 'App\Domain\Repository\ArticleRepositoryInterface'
        arguments:
            $inner: '@App\Infrastructure\Persistence\Doctrine\Repository\Decorator\ArticleRepositoryCacheDecorator.inner'
            $referenceCache: '@app.reference_cache'

    App\Infrastructure\Persistence\Doctrine\Repository\Decorator\PayTypeRepositoryCacheDecorator:
        decorates: 'App\Domain\Repository\PayTypeRepositoryInterface'
        arguments:
            $inner: '@App\Infrastructure\Persistence\Doctrine\Repository\Decorator\PayTypeRepositoryCacheDecorator.inner'
            $referenceCache: '@app.reference_cache'

    App\Infrastructure\Persistence\Doctrine\Repository\PayTypeRepository:
        arguments: []
    App\Infrastructure\Persistence\Doctrine\Repository\ArticleRepository:
        arguments: []

    App\Infrastructure\Persistence\Doctrine\Repository\OrderRepository:
        arguments: []

    App\Infrastructure\Persistence\Doctrine\Repository\OrderStatsProvider:
        arguments:
            $statsCache: '@app.stats_cache'

    App\Infrastructure\Search\ManticoreOrderSearch:
        arguments:
            $host: '%env(MANTICORE_HOST)%'
            $port: '%env(int:MANTICORE_PORT)%'
            $isEnabled: '%env(bool:MANTICORE_ENABLED)%'

    App\Infrastructure\Soap\WsdlProvider:
        arguments:
            $wsdlPath: '%kernel.project_dir%/public/wsdl/order.wsdl'

    App\Infrastructure\Soap\SoapServerFactory:
        arguments:
            $wsdlProvider: '@App\Infrastructure\Soap\WsdlProvider'
            $cacheEnabled: '%env(bool:SOAP_CACHE_ENABLED)%'

    Predis\ClientInterface:
        class: Predis\Client
        arguments:
            - '%env(REDIS_URL)%'

    Symfony\Component\Messenger\Transport\TransportInterface $messenger_transport_async:
        alias: 'messenger.transport.async'

    Doctrine\Migrations\DependencyFactory:
        alias: 'doctrine.migrations.dependency_factory'
